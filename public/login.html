<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <input type="text" id="usuario" placeholder="Usuario" required />
    <input type="password" id="contraseña" placeholder="Contraseña" required />
    <button type="button" id="iniciar-sesion">Iniciar sesión</button>
    <script>
document.getElementById('iniciar-sesion').addEventListener('click', async () => {
    const usuario = document.getElementById('usuario').value.trim();
    const contraseña = document.getElementById('contraseña').value.trim();

    if (!usuario || !contraseña) {
        alert('Por favor, completá todos los campos.');
        return;
    }

    try {
        const respuesta = await fetch('/api/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ usuario, contraseña })
        });

        console.log('Estado HTTP:', respuesta.status);
        console.log('Respuesta OK:', respuesta.ok);

        const resultado = await respuesta.text();
        console.log('Mensaje del servidor:', resultado);

        if (respuesta.ok) {
            window.location.href = '/problemas.html';
        } else {
            alert('Error del servidor. Código HTTP: ' + respuesta.status);
        }

    } catch (error) {
        console.error('Error en la petición:', error);
        alert('Error de conexión con el servidor');
    }
});
</script>
</html>
